version: '3.8'

services:
  # ============================================
  # Blockchain Layer - Hardhat Node
  # ============================================
  hardhat:
    image: node:18-alpine
    container_name: blackmatrix-hardhat
    working_dir: /workspace
    volumes:
      - ./smart-contracts:/workspace/smart-contracts
      - ./:/workspace
    environment:
      - NODE_ENV=development
    command: sh -c "cd smart-contracts && npm install --no-audit --no-fund && npx hardhat node --hostname 0.0.0.0"
    ports:
      - "8545:8545"
    networks:
      - blackmatrix-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8545"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # IPFS - Distributed Storage
  # ============================================
  ipfs:
    image: ipfs/go-ipfs:latest
    container_name: blackmatrix-ipfs
    ports:
      - "5001:5001"  # IPFS API
      - "4001:4001"  # IPFS Swarm
      - "8080:8080"  # IPFS Gateway
    volumes:
      - ipfs-data:/data/ipfs
      - ipfs-export:/export
    networks:
      - blackmatrix-net
    environment:
      - IPFS_PATH=/data/ipfs
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # Backend - Node.js Orchestrator
  # ============================================
  backend:
    image: node:18-alpine
    container_name: blackmatrix-backend
    working_dir: /workspace/backend
    volumes:
      - ./backend:/workspace/backend
      - /workspace/backend/node_modules
    environment:
      - NODE_ENV=development
      - ORCHESTRATOR_PORT=4000
      - HARDHAT_RPC=http://hardhat:8545
      - IPFS_API=http://ipfs:5001
      - LOG_LEVEL=debug
    command: sh -c "cd /workspace/backend && npm install --no-audit --no-fund && npm run start"
    ports:
      - "4000:4000"
    networks:
      - blackmatrix-net
    depends_on:
      hardhat:
        condition: service_healthy
      ipfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # Frontend - Next.js React App
  # ============================================
  frontend:
    image: node:18-alpine
    container_name: blackmatrix-frontend
    working_dir: /workspace/frontend
    volumes:
      - ./frontend:/workspace/frontend
      - /workspace/frontend/node_modules
      - /workspace/frontend/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_BASE=http://backend:4000
      - NEXT_PUBLIC_IPFS_GATEWAY=http://ipfs:8080
      - NEXT_PUBLIC_HARDHAT_RPC=http://hardhat:8545
    command: sh -c "cd /workspace/frontend && npm install --no-audit --no-fund && npm run dev"
    ports:
      - "3000:3000"
    networks:
      - blackmatrix-net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # WASM Sandbox - Rust WebAssembly Environment
  # ============================================
  wasm-sandbox:
    image: rust:1.70-slim
    container_name: blackmatrix-wasm
    working_dir: /workspace/wasm-sandbox
    volumes:
      - ./wasm-sandbox:/workspace/wasm-sandbox
      - cargo-cache:/usr/local/cargo
    environment:
      - RUST_LOG=debug
      - CARGO_HOME=/usr/local/cargo
    command: sh -c "sleep infinity"
    networks:
      - blackmatrix-net
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ============================================
# Networks Configuration
# ============================================
networks:
  blackmatrix-net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: bm0

# ============================================
# Volumes Configuration
# ============================================
volumes:
  ipfs-data:
    driver: local
  ipfs-export:
    driver: local
  cargo-cache:
    driver: local
